plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file("keystore.properties")
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

def releaseKeystorePath = signingProperties.getProperty("storeFile") ?: System.getenv("BIKE_KEYSTORE_PATH")
def releaseKeystorePassword = signingProperties.getProperty("storePassword") ?: System.getenv("BIKE_KEYSTORE_PASSWORD")
def releaseKeyAlias = signingProperties.getProperty("keyAlias") ?: System.getenv("BIKE_KEY_ALIAS")
def releaseKeyPassword = signingProperties.getProperty("keyPassword") ?: System.getenv("BIKE_KEY_PASSWORD")
def hasReleaseSigning = [
    releaseKeystorePath,
    releaseKeystorePassword,
    releaseKeyAlias,
    releaseKeyPassword
].every { it != null && !it.isEmpty() }

android {
    namespace 'com.anshmuthiyan.ebikeweather'
    compileSdk 34

    defaultConfig {
        applicationId "com.anshmuthiyan.ebikeweather"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    // Updated AndroidX libraries for Kotlin 2.0 compatibility
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    
    // Location & Activity Recognition
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Background work orchestration
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    
    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
}