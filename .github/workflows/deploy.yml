name: Build and Publish Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      - name: Build Release AAB
        env:
          BIKE_KEYSTORE_PATH: release.keystore
          BIKE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BIKE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BIKE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Upload to Google Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.muthiyan.ebike
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

