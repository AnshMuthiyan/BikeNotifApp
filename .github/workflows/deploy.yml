name: Build and Publish Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > app/release.keystore

      - name: Build Release AAB
        run: |
          chmod +x ./gradlew
          export BIKE_KEYSTORE_PATH="release.keystore"
          export BIKE_KEYSTORE_PASSWORD=$(echo "${{ secrets.KEYSTORE_PASSWORD }}" | tr -d '\n\r ')
          export BIKE_KEY_ALIAS=$(echo "${{ secrets.KEY_ALIAS }}" | tr -d '\n\r ')
          export BIKE_KEY_PASSWORD=$(echo "${{ secrets.KEY_PASSWORD }}" | tr -d '\n\r ')
          ./gradlew bundleRelease --stacktrace

      - name: Upload to Google Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.muthiyan.ebike
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

